version: 0.1
session_root: sessions
device:
  color_width: 640
  color_height: 480
  color_format: auto
  depth_width: 640
  depth_height: 480
  fps: 30
  frame_timeout_ms: 500
  connect_timeout_sec: 5
  align_to_color: true
  enable_color: true
  enable_depth: true
  record_bag: false
  bag_path: ''
  playback_bag: false
  playback_real_time: true
  depth_unit_scale: 0.001
  depth_min_m: 0.2
  depth_max_m: 1.0
  filters:
    enable_decimation: false
    decimation_magnitude: 2
    enable_spatial: true
    spatial_alpha: 0.5
    spatial_delta: 20
    spatial_magnitude: 2
    enable_temporal: true
    temporal_alpha: 0.4
    temporal_delta: 20
    enable_hole_filling: true
    hole_filling_mode: 1
    enable_threshold: true
scan:
  mode: realtime
  preview_stride: 5
  fusion_stride: 2
  max_queue: 30
  stop_on_lost: true
  lost_max_frames: 5
tracking:
  odom:
    max_depth_diff: 0.07
    min_depth: 0.2
    max_depth: 1.0
    pyramid_levels: 3
    eval_voxel: 0.02
    eval_max_correspondence: 0.03
    icp_voxel: 0.02
  icp_refine:
    enable: true
    max_correspondence: 0.03
  quality:
    fitness_ok: 0.3
    rmse_ok: 0.03
    fitness_warn: 0.2
    rmse_warn: 0.05
    motion_translation_warn: 0.15
    motion_translation_lost: 0.3
    motion_rotation_warn: 20.0
    motion_rotation_lost: 45.0
keyframe:
  min_translation: 0.03
  min_rotation_deg: 5.0
  min_quality: 0.2
  min_interval: 10
  max_keyframes: 300
  mode_overrides:
    realtime:
      min_interval: 10
    semi:
      min_interval: 6
    offline:
      min_interval: 1
loop_closure:
  enable: true
  temporal_gap: 30
  max_candidates: 5
  max_distance: 0.4
  use_all_frames: false
  use_colored_icp: true
  depth_trunc: 1.0
  ransac:
    distance_threshold: 0.03
    max_iterations: 4000
    confidence: 0.999
  icp:
    max_correspondence: 0.04
fusion:
  voxel_length: 0.004
  sdf_trunc: 0.02
  depth_trunc: 0.3
  color_type: rgb8
  preview_voxel: 0.01
  preview_mesh: false
mesh:
  simplify_target_triangles: 200000
  smooth_iterations: 5
  remove_small_components: true
  min_triangles: 500
  keep_largest: true
export:
  default_mesh_format: ply
  default_cloud_format: ply
ui:
  depth_colormap: jet
  log_max_lines: 500
  enable_3d_viewer: true
  default_view: rgbd
  defer_ui: true
  language: zh-CN
  theme: dark
  performance: high
logging:
  level: INFO
