[project]
name = "realsense-handheld-scanner"
version = "0.1.0"
description = "Handheld 3D scanner for Intel RealSense D435 using Open3D + PySide6 + PyVistaQt"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Your Team", email = "dev@example.com"}
]
keywords = ["realsense", "rgbd", "slam", "3d", "open3d", "pyvista", "pyside6"]

dependencies = [
  "numpy>=1.23",
  "pyyaml>=6.0",
  "open3d>=0.18",
  "pyrealsense2>=2.54; platform_system != 'Darwin'",
  "PySide6>=6.5",
  "pyvista>=0.43",
  "pyvistaqt>=0.11",
  "vtk>=9.2",
  "opencv-python>=4.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
realsense-scanner-gui = "scanner.app:main"
realsense-scanner-cli = "scanner.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
